<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ListExpress - Visualizar Productos</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 12px;
        }
        .container {
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            padding: 20px;
            border: 1px solid #333;
        }
        h1 {
            color: #bb86fc;
            font-size: 1.6rem;
        }
        .table th, .table td {
            vertical-align: middle;
            background: #2c2c2c;
            color: #e0e0e0;
            border-color: #3e3e3e;
        }
        .thead-dark th {
            background: #3700b3;
            border-color: #4a148c;
        }
        .modal-content {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
        }
        .modal-header, .modal-footer {
            border-color: #333;
        }
        .form-control {
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
        }
        .form-control:focus {
            background: #333;
            color: #fff;
            border-color: #03dac6;
        }
        .btn-teal {
            background: #03dac6;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mt-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0"><i class="fas fa-boxes"></i> Lista Completa</h1>
            <a href="index.html" class="btn btn-teal btn-sm">
                <i class="fas fa-shopping-cart"></i> Modo Carrito
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-sm table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>Estado</th>
                        <th>Producto</th>
                        <th>Cant.</th>
                        <th>Precio (S/)</th>
                        <th>Subtotal</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <!-- Se carga dinámicamente -->
                </tbody>
            </table>
        </div>

        <div class="mt-3 d-flex justify-content-between">
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver al Tablero
            </a>
            <a href="add.html" class="btn btn-outline-info">
                <i class="fas fa-plus"></i> Agregar Más
            </a>
        </div>
    </div>

    <!-- Modal Editar Producto -->
    <div class="modal fade" id="editProductModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <form id="editProductForm">
                    <div class="modal-header">
                        <h5 class="modal-title font-weight-bold text-info"><i class="fas fa-edit mr-2"></i> Editar Producto</h5>
                        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editProductIndex">
                        <div class="form-group">
                            <label for="editProductName">Nombre</label>
                            <input type="text" class="form-control" id="editProductName" required>
                        </div>
                        <div class="form-group">
                            <label for="editProductQuantity">Cantidad</label>
                            <input type="number" min="1" class="form-control" id="editProductQuantity" required>
                        </div>
                        <div class="form-group">
                            <label for="editProductPrice">Precio Unitario (S/)</label>
                            <input type="number" step="0.01" class="form-control" id="editProductPrice" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-teal">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/model.js"></script>
    <script>
        function loadTableView() {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';
            const items = getProducts();

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No hay productos registrados.</td></tr>`;
                return;
            }

            items.forEach((p, index) => {
                const price = p.inCart ? (p.realPrice || p.estimatedPrice) : p.estimatedPrice;
                const subtotal = (price * p.quantity).toFixed(2);
                const statusBadge = p.inCart 
                    ? `<span class="badge badge-success"><i class="fas fa-check"></i> En Carrito</span>`
                    : `<span class="badge badge-secondary"><i class="fas fa-clock"></i> Pendiente</span>`;

                const row = `
                    <tr>
                        <td class="text-center align-middle">${statusBadge}</td>
                        <td class="align-middle font-weight-bold">${escapeHtml(p.name)}</td>
                        <td class="text-center align-middle">${p.quantity}</td>
                        <td class="text-right align-middle">S/ ${(price || 0).toFixed(2)}</td>
                        <td class="text-right align-middle font-weight-bold text-info">S/ ${subtotal}</td>
                        <td class="text-center align-middle">
                            <button class="btn btn-sm btn-outline-info mr-1" onclick="openEdit(${index})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${index})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function openEdit(index) {
            const p = getProducts()[index];
            if (!p) return;
            document.getElementById('editProductIndex').value = index;
            document.getElementById('editProductName').value = p.name;
            document.getElementById('editProductQuantity').value = p.quantity;
            document.getElementById('editProductPrice').value = (p.inCart ? p.realPrice : p.estimatedPrice) || 0;
            $('#editProductModal').modal('show');
        }

        document.getElementById('editProductForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('editProductIndex').value, 10);
            const name = document.getElementById('editProductName').value;
            const quantity = parseInt(document.getElementById('editProductQuantity').value, 10);
            const price = parseFloat(document.getElementById('editProductPrice').value);

            updateProduct(index, name, quantity, price, {
                realPrice: price
            });
            $('#editProductModal').modal('hide');
            loadTableView();
        });

        function deleteItem(index) {
            if (confirm('¿Eliminar este producto?')) {
                deleteProduct(index);
                loadTableView();
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }

        window.onload = loadTableView;
    </script>
</body>
</html>
